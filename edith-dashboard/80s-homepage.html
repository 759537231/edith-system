<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 80年代风格</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* 80年代风格CSS */
        :root {
            --neon-pink: #ff6ec7;
            --neon-blue: #00d4ff;
            --neon-purple: #9b59b6;
            --retro-dark: #1a1a2e;
            --grid-color: rgba(0, 212, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: var(--retro-dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 网格背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* CRT扫描线效果 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* 头部区域 */
        .header {
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }

        .neon-title {
            font-size: 2.5rem;
            color: var(--neon-pink);
            text-shadow: 
                0 0 5px var(--neon-pink),
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink);
            animation: neon-flicker 2s infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes neon-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* 个人信息卡片 */
        .profile-card {
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            padding: 30px;
            margin: 40px auto;
            max-width: 600px;
            box-shadow: 
                0 0 10px var(--neon-purple),
                inset 0 0 10px var(--neon-purple);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
            margin: 0 auto 20px;
            display: block;
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .profile-info h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .profile-info p {
            color: #ccc;
            line-height: 1.8;
            font-size: 0.7rem;
        }

        /* 技能展示区 */
        .skills-section {
            padding: 40px 20px;
            text-align: center;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 30px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .skill-item {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .skill-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .skill-name {
            color: var(--neon-blue);
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .skill-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .skill-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            border-radius: 5px;
            transition: width 1s ease;
        }

        /* 联系方式区 */
        .contact-section {
            padding: 40px 20px;
            text-align: center;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact-link {
            color: var(--neon-pink);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 10px 20px;
            border: 1px solid var(--neon-pink);
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .contact-link:hover {
            background: var(--neon-pink);
            color: var(--retro-dark);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* 底部装饰 */
        .footer {
            text-align: center;
            padding: 40px;
            color: var(--neon-purple);
            font-size: 0.6rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .neon-title {
                font-size: 1.5rem;
            }
            
            .profile-card {
                margin: 20px 10px;
                padding: 20px;
            }
            
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 头部区域 -->
    <header class="header">
        <h1 class="neon-title">欢迎来到我的世界</h1>
        <p class="subtitle">[ 80年代风格个人主页 ]</p>
    </header>

    <!-- 个人信息卡片 -->
    <section class="profile-card">
        <div class="avatar">👨‍💻</div>
        <div class="profile-info">
            <h2>张三</h2>
            <p>全栈开发者 | 复古爱好者 | 像素艺术家</p>
            <p>热爱80年代的美学，迷恋霓虹灯的光芒，相信代码可以创造无限可能。</p>
            <p>在数字世界中寻找复古与未来的平衡点。</p>
        </div>
    </section>

    <!-- 技能展示区 -->
    <section class="skills-section">
        <h2 class="section-title">⚡ 我的技能</h2>
        <div class="skills-grid">
            <div class="skill-item">
                <div class="skill-name">HTML/CSS</div>
                <div class="skill-bar">
                    <div class="skill-fill" style="width: 90%"></div>
                </div>
            </div>
            <div class="skill-item">
                <div class="skill-name">JavaScript</div>
                <div class="skill-bar">
                    <div class="skill-fill" style="width: 85%"></div>
                </div>
            </div>
            <div class="skill-item">
                <div class="skill-name">Python</div>
                <div class="skill-bar">
                    <div class="skill-fill" style="width: 80%"></div>
                </div>
            </div>
            <div class="skill-item">
                <div class="skill-name">React</div>
                <div class="skill-bar">
                    <div class="skill-fill" style="width: 75%"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系方式区 -->
    <section class="contact-section">
        <h2 class="section-title">📡 联系我</h2>
        <div class="contact-links">
            <a href="mailto:example@email.com" class="contact-link">📧 邮箱</a>
            <a href="https://github.com" class="contact-link">🐙 GitHub</a>
            <a href="https://twitter.com" class="contact-link">🐦 Twitter</a>
            <a href="https://linkedin.com" class="contact-link">💼 LinkedIn</a>
        </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
        <p>© 2026 个人主页 - 80年代风格</p>
        <p>[ 用代码编织复古未来 ]</p>
    </footer>

    <script>
        // 打字机效果
        const neonTitle = document.querySelector('.neon-title');
        const originalText = neonTitle.textContent;
        neonTitle.textContent = '';
        
        let i = 0;
        function typeWriter() {
            if (i < originalText.length) {
                neonTitle.textContent += originalText.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }
        
        // 页面加载后开始打字
        window.onload = function() {
            setTimeout(typeWriter, 500);
        };

        // 鼠标跟随光标效果
        document.addEventListener('mousemove', function(e) {
            const cursor = document.createElement('div');
            cursor.style.position = 'fixed';
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.width = '10px';
            cursor.style.height = '10px';
            cursor.style.background = 'var(--neon-pink)';
            cursor.style.borderRadius = '50%';
            cursor.style.pointerEvents = 'none';
            cursor.style.zIndex = '9999';
            cursor.style.boxShadow = '0 0 10px var(--neon-pink)';
            cursor.style.opacity = '0.7';
            document.body.appendChild(cursor);
            
            setTimeout(() => {
                cursor.remove();
            }, 500);
        });
    </script>
</body>
</html>
